name: Deploy to Live Server

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔨 Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: 📂 Sync files (Clean Deploy)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # server-dir: public_html/  <-- Adjust this if your site is in a subfolder or root
          dangerous-clean-slate: true # This deletes everything on the server not in git!
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
